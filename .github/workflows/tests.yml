name: Run Java tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Show Java and Chrome versions
        run: |
          java -version
          google-chrome --version

      - name: Run tests
        run: mvn test
